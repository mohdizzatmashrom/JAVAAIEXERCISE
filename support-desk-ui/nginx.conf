server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- Static assets ----------
    # Vite emits hashed filenames in assets/, so cache them aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API reverse proxy ----------
    # Mirrors the Vite dev-server proxy: /api/* -> backend:8080/api/*
    # Uses Docker DNS resolver so the upstream is resolved at runtime,
    # allowing the container to start even when 'backend' is not yet reachable.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream http://backend:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- SPA fallback ----------
    # Any route that doesn't match a real file falls back to index.html
    # so React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
